name: GenAI Architectural Publisher (3x Daily)

on:
  schedule:
    # Runs 3 times a day (every 8 hours at 00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Suggest custom GenAI topic (e.g. Diffusion Models, Reasoning Models, FlashAttention)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: 'genai-publisher'
  cancel-in-progress: false

jobs:
  publish_post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Automated GenAI Post Generator
        env:
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          if [ -n "$CUSTOM_TOPIC" ]; then
            echo "Generating custom suggested topic: $CUSTOM_TOPIC"
            python -u scripts/generate_post.py --custom-topic "$CUSTOM_TOPIC"
          else
            echo "Generating next scheduled GenAI topic from queue"
            python -u scripts/generate_post.py
          fi

      - name: Commit and Push Updated Knowledge Base
        run: |
          git config --global user.name "GenAI Architecture Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-publish: New GenAI dispatch [skip ci]"
          git pull --rebase origin main || true
          git push
